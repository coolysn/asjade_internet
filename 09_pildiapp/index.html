<!doctype html>
<html>
<head>
  <title>Video</title>
  <p>Sinine tähendab "jah", oranž tähendab "ei".</p>

  <script>
    let player=null, c=null, g=null, g2=null, kysimusElement=null, varvElement=null;
    let nr=0;
    let vastused=[];
    let vastatud=false;
    let valmisVastuseks=false;
    let varvKaadrites=0;
    let eelmineVarv="";
    let viimaneKaader=0;
    const kaadriIntervall=200;

    let kysimused=[
      "Kas sulle meeldib õun?",
      "Kas sulle meeldib banaan?",
      "Kas sulle meeldib jäätis?"
    ];

    function start(){
      player=document.getElementById("v1");
      c=document.getElementById("c1");
      g=c.getContext("2d", {willReadFrequently:true});
      g2=document.getElementById("c2").getContext("2d");
      kysimusElement=document.getElementById("s1");
      varvElement=document.getElementById("varv");

      kysimusElement.textContent=kysimused[nr];

      navigator.mediaDevices.getUserMedia({video:true}).then((stream)=>{
        player.srcObject=stream;
      });

      requestAnimationFrame(capture);
    }

    function capture(aeg){
      requestAnimationFrame(capture);

      if(aeg-viimaneKaader<kaadriIntervall){
        return;
      }
      viimaneKaader=aeg;

      g.drawImage(player,0,0,c.width,c.height);

      g.strokeRect(98,98,44,44);

      let d=g.getImageData(100,100,40,40);

      g2.putImageData(d,0,0);

      let r=0, green=0, b=0;

      for(let i=0;i<d.data.length;i+=4){
        r+=d.data[i];
        green+=d.data[i+1];
        b+=d.data[i+2];
      }

      let piksliteArv=d.data.length/4;
      let varv=leiaVarv(r/piksliteArv,green/piksliteArv,b/piksliteArv);
      varvElement.textContent="Tuvastatud värv: " +
        (varv==="" ? "värvi ei tuvastatud" : varv);

      if(vastatud==false){
        // Enne uue vastuse lubamist peab kaamera nägema neutraalset vaadet.
        if(varv===""){
          valmisVastuseks=true;
          varvKaadrites=0;
          eelmineVarv="";
        }
        else if(valmisVastuseks && varv===eelmineVarv){
          varvKaadrites++;
        }
        else if(valmisVastuseks){
          eelmineVarv=varv;
          varvKaadrites=1;
        }

        if(valmisVastuseks && varvKaadrites>=3){
          vastused.push(varv==="sinine" ? "Jah" : "Ei");
          vastatud=true;
          järgmine();
        }
      }
    }

    function leiaVarv(r,green,b){
      if(b>r && b>green){
        return "sinine";
      }
      if(r>100 && green>50 && b<50){
        return "oranž";
      }
      return "";
    }

    function järgmine(){
      nr++;
      vastatud=false;
      valmisVastuseks=false;
      varvKaadrites=0;
      eelmineVarv="";

      if(nr<kysimused.length){
        kysimusElement.textContent=kysimused[nr];
      }
      else{
        let tulemus="Vastused:\n";
        for(let i=0;i<kysimused.length;i++){
          tulemus+=kysimused[i]+" - "+vastused[i]+"\n";
        }
        kysimusElement.textContent=tulemus;
      }
    }
  </script>
</head>

<body onload="start()">

  <span id="s1" style="white-space:pre-line"></span><br>

  <video id="v1" controls autoplay style="width:45%"></video>

  <canvas id="c1" width="320" height="240" style="width:45%"></canvas><br>

  <canvas id="c2" width="40" height="40"></canvas>
  <p id="varv">Tuvastatud värv: värvi ei tuvastatud</p>

</body>
</html>
